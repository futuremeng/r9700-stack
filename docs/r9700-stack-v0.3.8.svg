<text x="32" y="120" font-size="14" font-weight="700" fill="#34d399">01</text>
<text x="32" y="138" font-size="14" font-weight="700" fill="#8e979f">WHAT IT IS</text>
<rect x="16" y="214" width="968" height="274" rx="12" fill="#161a1d" stroke="#2a3036"/>
<text x="32" y="244" font-size="14" font-weight="700" fill="#34d399">02</text>
<text x="32" y="262" font-size="14" font-weight="700" fill="#8e979f">WHAT RUNS</text>
<rect x="16" y="502" width="968" height="330" rx="12" fill="#161a1d" stroke="#2a3036"/>
<text x="32" y="532" font-size="14" font-weight="700" fill="#34d399">03</text>
<text x="32" y="550" font-size="14" font-weight="700" fill="#8e979f">HOW FAST</text>
<text x="128" y="124" font-size="19" font-weight="600" fill="#eef1f3">a vLLM plugin plus HIP and Triton kernels for gfx1201 (RDNA4)</text>
<rect x="128" y="175" width="148.0" height="27" rx="13.5" fill="#1d2226" stroke="#2a3036"/>
<text x="139" y="195" font-size="14" font-weight="700" fill="#eef1f3">stock vLLM 0.32</text>
<rect x="284.0" y="175" width="131.2" height="27" rx="13.5" fill="#1d2226" stroke="#2a3036"/>
<text x="295.0" y="195" font-size="14" font-weight="700" fill="#eef1f3">stock ROCm 10</text>
<rect x="423.2" y="175" width="80.8" height="27" rx="13.5" fill="none" stroke="#2a3036"/>
<text x="434.2" y="195" font-size="14" fill="#8e979f">no fork</text>
<rect x="512.0" y="175" width="206.8" height="27" rx="13.5" fill="none" stroke="#2a3036"/>
<text x="523.0" y="195" font-size="14" fill="#8e979f">unmodified checkpoints</text>
<rect x="726.8" y="175" width="164.8" height="27" rx="13.5" fill="none" stroke="#2a3036"/>
<text x="737.8" y="195" font-size="14" fill="#8e979f">loaded at runtime</text>
<rect x="128.0" y="240" width="276.0" height="222" rx="10" fill="#1d2226" stroke="#2a3036"/>
<text x="140.0" y="266" font-size="19" font-weight="700" fill="#eef1f3">Qwen3.8-Flash-Next</text>
<text x="140.0" y="286" font-size="14" fill="#f5b53d">MoE, 288 experts</text>
<text x="140.0" y="314" font-size="14" fill="#c7cdd3">·  MXFP4 experts, fp8 dense</text>
<text x="140.0" y="334" font-size="14" fill="#c7cdd3">   MTP-3 speculative decoding</text>
<text x="140.0" y="354" font-size="14" fill="#c7cdd3">   int6 embeddings in host RAM</text>
<text x="140.0" y="374" font-size="14" fill="#c7cdd3">   262k context on four cards</text>
<rect x="140.0" y="403" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="156.0" y="403" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="172.0" y="403" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="188.0" y="403" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<text x="210.0" y="416" font-size="15" font-weight="700" fill="#eef1f3">TP4 · 4 cards</text>
<text x="140.0" y="436" font-size="14" fill="#8e979f">or two cards, experts in RAM</text>
<rect x="418.0" y="240" width="276.0" height="222" rx="10" fill="#1d2226" stroke="#2a3036"/>
<text x="430.0" y="266" font-size="19" font-weight="700" fill="#eef1f3">Qwen3.8-27B-NVFP4</text>
<text x="430.0" y="286" font-size="14" fill="#f5b53d">dense + DFlash2 drafter</text>
<text x="430.0" y="314" font-size="14" fill="#c7cdd3">·  NVFP4 in, MXFP4 at load</text>
<text x="430.0" y="334" font-size="14" fill="#c7cdd3">   fp8 KV cache, fp8 drafter</text>
<text x="430.0" y="354" font-size="14" fill="#c7cdd3">   DFlash2 shares the MTP kernels</text>
<rect x="430.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="446.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<text x="468.0" y="396" font-size="15" font-weight="700" fill="#eef1f3">TP2 · 2 cards</text>
<rect x="708.0" y="240" width="276.0" height="222" rx="10" fill="#1d2226" stroke="#2a3036"/>
<text x="720.0" y="266" font-size="19" font-weight="700" fill="#eef1f3">GLM-5.3-Flash</text>
<text x="720.0" y="286" font-size="14" fill="#f5b53d">sparse MLA + indexer</text>
<text x="720.0" y="314" font-size="14" fill="#c7cdd3">·  NVFP4 checkpoint + MTP layer</text>
<text x="720.0" y="334" font-size="14" fill="#c7cdd3">   NVFP4 in, MXFP4 at load</text>
<text x="720.0" y="354" font-size="14" fill="#c7cdd3">   fp8 KV cache, MTP-3</text>
<rect x="720.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="736.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="752.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="768.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="784.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="800.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="816.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<rect x="832.0" y="383" width="11" height="13" rx="2" fill="#f5b53d" stroke="none"/>
<text x="854.0" y="396" font-size="15" font-weight="700" fill="#eef1f3">TP8 · 8 cards</text>
<text x="720.0" y="416" font-size="14" fill="#8e979f">8-rank collective via host RAM</text>
<text x="128" y="532" font-size="15" font-weight="700" fill="#eef1f3">single-stream decode, tok/s</text>
<text x="128" y="566" font-size="15" font-weight="700" fill="#eef1f3">Qwen3.8-Flash-Next</text>
<text x="128" y="584" font-size="14" fill="#8e979f">TP4, four cards · 210 W gate</text>
<rect x="128" y="594" width="270.0" height="18" rx="7" fill="#7b93ff" stroke="none"/>
<text x="440" y="610" font-size="26" font-weight="800" fill="#eef1f3">225</text>
<text x="496.8" y="610" font-size="14" fill="#8e979f">tok/s</text>
<text x="128" y="628" font-size="14" fill="#8e979f">14.3-14.4 ms a step; best sample 228</text>
<text x="128" y="652" font-size="15" font-weight="700" fill="#eef1f3">Qwen3.8-27B-NVFP4</text>
<text x="128" y="670" font-size="14" fill="#8e979f">TP2, two cards · 210 W gate</text>
<rect x="128" y="680" width="266.4" height="18" rx="7" fill="#7b93ff" stroke="none"/>
<text x="440" y="696" font-size="26" font-weight="800" fill="#eef1f3">222</text>
<text x="496.8" y="696" font-size="14" fill="#8e979f">tok/s</text>
<text x="128" y="714" font-size="14" fill="#8e979f">4.5 tokens a step with the DFlash2 drafter</text>
<text x="128" y="738" font-size="15" font-weight="700" fill="#eef1f3">GLM-5.3-Flash</text>
<text x="128" y="756" font-size="14" fill="#8e979f">TP8, eight cards · 210 W gate</text>
<rect x="128" y="766" width="120.0" height="18" rx="7" fill="#7b93ff" stroke="none"/>
<text x="440" y="782" font-size="26" font-weight="800" fill="#eef1f3">100</text>
<text x="496.8" y="782" font-size="14" fill="#8e979f">tok/s</text>
<text x="128" y="800" font-size="14" fill="#8e979f">75-80 before v0.3.8's host-memory collective</text>
<text x="644" y="532" font-size="15" font-weight="700" fill="#eef1f3">aggregate · prefill · context</text>
<text x="644" y="550" font-size="14" fill="#8e979f">the native box, uncapped</text>
<text x="644" y="580" font-size="15" font-weight="700" fill="#eef1f3">1,823 tok/s</text>
<text x="644" y="598" font-size="14" fill="#c7cdd3">aggregate decode, 32 in flight,</text>
<text x="644" y="616" font-size="14" fill="#c7cdd3">1,200-token waves</text>
<text x="644" y="650" font-size="15" font-weight="700" fill="#eef1f3">9,633 tok/s</text>
<text x="644" y="668" font-size="14" fill="#c7cdd3">reading a 7,789-token prompt</text>
<text x="644" y="702" font-size="15" font-weight="700" fill="#eef1f3">540,202 tokens</text>
<text x="644" y="720" font-size="14" fill="#c7cdd3">KV pool at MAXLEN 262,144; a needle</text>
<text x="644" y="738" font-size="14" fill="#c7cdd3">found at 250,078</text>
<text x="16" y="856" font-size="14" fill="#8e979f">Each number names its machine: "210 W gate" is the release configuration (210 W a card, -42 mV, 32k); "the native</text>
<text x="16" y="874" font-size="14" fill="#8e979f">box" is one 4x R9700 box, uncapped. They are not comparable across.</text>
<text x="16" y="892" font-size="14" fill="#8e979f">github.com/bkvargyas/r9700-stack</text>
