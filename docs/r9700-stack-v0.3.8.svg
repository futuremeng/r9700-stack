<text x="519.4" y="52" font-size="14" fill="#34d399">v0.3.8 · 2026-10-31 · vLLM 0.32 line, nightly e4a5b553</text>
<text x="16" y="78" font-size="14" fill="#8e979f">LLM inference on 2 to 8 AMD Radeon AI PRO R9700</text>
