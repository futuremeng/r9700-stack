<text x="128" y="802" font-size="15" font-weight="700" fill="#eef1f3">Qwen3.8-Flash-Next</text>
<text x="128" y="820" font-size="14" fill="#8e979f">TP4, four cards · 210 W gate</text>
<rect x="128" y="830" width="270.0" height="18" rx="7" fill="#7b93ff" stroke="none"/>
<text x="440" y="846" font-size="26" font-weight="800" fill="#eef1f3">225</text>
<text x="496.8" y="846" font-size="14" fill="#8e979f">tok/s</text>
<text x="128" y="864" font-size="14" fill="#8e979f">14.3-14.4 ms a step; best sample 228</text>
<text x="128" y="888" font-size="15" font-weight="700" fill="#eef1f3">Qwen3.8-27B-NVFP4</text>
<text x="128" y="906" font-size="14" fill="#8e979f">TP2, two cards · 210 W gate</text>
<rect x="128" y="916" width="266.4" height="18" rx="7" fill="#7b93ff" stroke="none"/>
<text x="440" y="932" font-size="26" font-weight="800" fill="#eef1f3">222</text>
<text x="496.8" y="932" font-size="14" fill="#8e979f">tok/s</text>
<text x="128" y="950" font-size="14" fill="#8e979f">4.5 tokens a step with the DFlash2 drafter</text>
<text x="128" y="974" font-size="15" font-weight="700" fill="#eef1f3">GLM-5.3-Flash</text>
<text x="128" y="992" font-size="14" fill="#8e979f">TP8, eight cards · 210 W gate</text>
<rect x="128" y="1002" width="120.0" height="18" rx="7" fill="#7b93ff" stroke="none"/>
<text x="440" y="1018" font-size="26" font-weight="800" fill="#eef1f3">100</text>
<text x="496.8" y="1018" font-size="14" fill="#8e979f">tok/s</text>
<text x="128" y="1036" font-size="14" fill="#8e979f">75-80 before v0.3.8's host-memory collective</text>
<text x="128" y="1060" font-size="15" font-weight="700" fill="#eef1f3">DeepSeek-V4.1-Flash</text>
<text x="128" y="1078" font-size="14" fill="#8e979f">TP8+EP, EXL3 · 8 cards, -500 MHz</text>
<rect x="128" y="1088" width="189.6" height="18" rx="7" fill="#7b93ff" stroke="none"/>
<text x="440" y="1104" font-size="26" font-weight="800" fill="#eef1f3">158</text>
<text x="496.8" y="1104" font-size="14" fill="#8e979f">tok/s</text>
<text x="128" y="1122" font-size="14" fill="#8e979f">on code; 70-75 on prose, GSM8K-style 114-121</text>
<text x="644" y="768" font-size="15" font-weight="700" fill="#eef1f3">aggregate · prefill · context</text>
<text x="644" y="786" font-size="14" fill="#8e979f">the native box, uncapped</text>
<text x="644" y="816" font-size="15" font-weight="700" fill="#eef1f3">1,792 tok/s</text>
<text x="644" y="834" font-size="14" fill="#c7cdd3">aggregate decode, 32 in flight,</text>
<text x="644" y="852" font-size="14" fill="#c7cdd3">1,200-token waves, fp8 main KV</text>
<text x="644" y="886" font-size="15" font-weight="700" fill="#eef1f3">9,702 tok/s</text>
<text x="644" y="904" font-size="14" fill="#c7cdd3">reading a 7,792-token prompt on that</text>
<text x="644" y="922" font-size="14" fill="#c7cdd3">same fp8 launch</text>
<text x="644" y="956" font-size="15" font-weight="700" fill="#eef1f3">1,009,899 tokens</text>
<text x="644" y="974" font-size="14" fill="#c7cdd3">KV pool at MAXLEN 262,144 with fp8 e4m3</text>
<text x="644" y="992" font-size="14" fill="#c7cdd3">main KV, 540,202 at bf16; a needle found</text>
<text x="644" y="1010" font-size="14" fill="#c7cdd3">at 250,078</text>
<text x="16" y="1178" font-size="14" fill="#8e979f">Each number names its machine: "210 W gate" is the release configuration (210 W a card, -42 mV, 32k); "the native</text>
<text x="16" y="1196" font-size="14" fill="#8e979f">box" is one 4x R9700 box, uncapped. They are not comparable across.</text>
<text x="16" y="1214" font-size="14" fill="#8e979f">The Flash-Next column is the fp8 e4m3 main-KV launch this box runs by default: the pool doubles (1,009,899 against</text>
<text x="16" y="1232" font-size="14" fill="#8e979f">540,202 tokens) and GSM8K 800 reads 96.0 against 95.6 %, HumanEval 164 98.17 against 96.95.</text>
<text x="16" y="1250" font-size="14" fill="#8e979f">github.com/bkvargyas/r9700-stack</text>
